name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in --dry-run mode (no upload)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already on npm
        if: ${{ !inputs.dry_run }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=${{ steps.version.outputs.version }}
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published. Bump the version in package.json before running this workflow."
            exit 1
          fi
          echo "$name@$version is not published yet — proceeding."

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --provenance --access public

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public

      # Creating the GitHub release also creates the git tag pointing at the
      # current commit via the API, so we don't run a separate `git push
      # origin <tag>` step. That separate push gets rejected when the commit
      # being tagged includes workflow file changes — the GITHUB_TOKEN issued
      # to Actions doesn't carry the `workflows` scope, and git push surfaces
      # the underlying App-permission check. The releases API doesn't.
      - name: Create GitHub release (creates tag via API)
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](./CHANGELOG.md) for details.

            Install: `npm install wdio-bstack-reporter@${{ steps.version.outputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
